services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: ${GATEWAY_IMAGE_REPOSITORY:-partners-gateway-smoke}:${IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      GATEWAY_STORE: postgres
      GATEWAY_ARTIFACT_STORE: s3
      GATEWAY_WORK_ROOT: /var/lib/partners/workspaces
      GATEWAY_ARTIFACT_ROOT: /var/lib/partners/artifacts
      GATEWAY_SERVICE_TOKEN: local-dev-token
      GATEWAY_SERVICE_TOKEN_REF: local-dev
      GATEWAY_SERVICE_ACTOR: local-smoke
      GATEWAY_SERVICE_SCOPES: "*"
      GATEWAY_TENANT_IDS: local
      GATEWAY_PROJECT_IDS: partners
      TZ: UTC
      POSTGRES_URL: postgres://partners:partners@postgres:5432/partners
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: partners-artifacts
      S3_REGION: us-east-1
      S3_PREFIX: gateway-artifacts
      S3_ACCESS_KEY_ID: partners
      S3_SECRET_ACCESS_KEY: partners-secret
    ports:
      - "18080:8080"
    volumes:
      - gateway-workspaces:/var/lib/partners/workspaces
      - gateway-artifacts:/var/lib/partners/artifacts
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  console:
    build:
      context: .
      dockerfile: Dockerfile.console
    image: ${CONSOLE_IMAGE_REPOSITORY:-partners-console-smoke}:${IMAGE_TAG:-local}
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      CONSOLE_HOST: 0.0.0.0
      CONSOLE_PORT: 3000
      GATEWAY_URL: http://gateway:8080
    ports:
      - "13000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partners
      POSTGRES_USER: partners
      POSTGRES_PASSWORD: partners
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partners -d partners"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: partners
      MINIO_ROOT_PASSWORD: partners-secret
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data

  minio-bootstrap:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until mc alias set local http://minio:9000 partners partners-secret; do
        sleep 1;
      done;
      mc mb --ignore-existing local/partners-artifacts"

volumes:
  gateway-workspaces:
  gateway-artifacts:
  postgres-data:
  minio-data:

# Opt-in only: this RuntimeClass is never selected by default.
# The node label is added only after runsc has been installed and verified.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/part-of: partners
handler: runsc
scheduling:
  nodeSelector:
    partners.dev/gvisor: "true"

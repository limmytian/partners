apiVersion: apps/v1
kind: Deployment
metadata:
  name: partners-console
  namespace: partners
  labels:
    app: partners-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: partners-console
  template:
    metadata:
      labels:
        app: partners-console
    spec:
      containers:
        - name: console
          image: __CONSOLE_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: CONSOLE_HOST
              value: "0.0.0.0"
            - name: CONSOLE_PORT
              value: "3000"
            - name: GATEWAY_URL
              value: "__GATEWAY_URL__"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

---

apiVersion: v1
kind: Service
metadata:
  name: partners-console
  namespace: partners
  labels:
    app: partners-console
spec:
  type: NodePort
  selector:
    app: partners-console
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30011

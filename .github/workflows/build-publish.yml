name: Build and Publish Container Images

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag override (default: branch-short_sha)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  GATEWAY_IMAGE: ghcr.io/${{ github.repository }}-gateway
  SANDBOX_IMAGE: ghcr.io/${{ github.repository }}-sandbox
  CONSOLE_IMAGE: ghcr.io/${{ github.repository }}-console

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(git rev-parse --short HEAD)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Sandbox Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.SANDBOX_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.SANDBOX_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.GATEWAY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Console Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.console
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.CONSOLE_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.CONSOLE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

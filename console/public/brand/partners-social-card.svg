<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    
    <!-- Cyan Link Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#00c4ff"/>
      <stop offset="100%" stop-color="#007ae8"/>
    </linearGradient>

    <!-- Indigo Link Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7982ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Master Ring Path -->
    <path id="ringMaster" fill-rule="evenodd" d="
  M -47,-99 L 47,-99 A 52 52 0 0 1 99,-47 L 99,47 A 52 52 0 0 1 47,99 L -47,99 A 52 52 0 0 1 -99,47 L -99,-47 A 52 52 0 0 1 -47,-99 Z
  M -31,-51 L 31,-51 A 20 20 0 0 1 51,-31 L 51,31 A 20 20 0 0 1 31,51 L -31,51 A 20 20 0 0 1 -51,31 L -51,-31 A 20 20 0 0 1 -31,-51 Z
"/>

    <!-- Clips for shadow targeting -->
    <clipPath id="cyanClip">
      <g transform="translate(203, 256) rotate(45)">
        <use href="#ringMaster"/>
      </g>
    </clipPath>

    <clipPath id="indigoClip">
      <g transform="translate(309, 256) rotate(45)">
        <use href="#ringMaster"/>
      </g>
    </clipPath>

    <!-- Top-left patch clip for Indigo -->
    <clipPath id="indigoTopPatchClip">
      <polygon points="180,110 320,110 320,240 180,240"/>
    </clipPath>

    <!-- Shadow Blur Filters -->
    <filter id="shadowIndigoOnCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="shadowCyanOnIndigo" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <clipPath id="bottomRegion">
      <rect x="150" y="240" width="200" height="180"/>
    </clipPath>

    <clipPath id="topRegion">
      <rect x="150" y="90" width="200" height="160"/>
    </clipPath>
  
    <radialGradient id="socialGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="socialTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#socialGlow)"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo Mark centered at top -->
  <g transform="translate(470, 70) scale(0.5078)">
    

  <!-- 1. Base Indigo Ring -->
  <g id="indigoRing" transform="translate(309, 256) rotate(45)">
    <use href="#ringMaster" fill="url(#indigoGrad)"/>
  </g>

  <!-- 2. Shadow of Cyan onto Indigo (Bottom Crossing) -->
  <g clip-path="url(#bottomRegion)">
    <g clip-path="url(#indigoClip)">
      <g transform="translate(205, 259) rotate(45)">
        <use href="#ringMaster" fill="#000000" opacity="0.55" filter="url(#shadowCyanOnIndigo)"/>
      </g>
    </g>
  </g>

  <!-- 3. Base Cyan Ring -->
  <g id="cyanRing" transform="translate(203, 256) rotate(45)">
    <use href="#ringMaster" fill="url(#cyanGrad)"/>
  </g>

  <!-- 4. Shadow of Indigo onto Cyan (Top Crossing) -->
  <g clip-path="url(#topRegion)">
    <g clip-path="url(#cyanClip)">
      <g transform="translate(307, 259) rotate(45)">
        <use href="#ringMaster" fill="#000000" opacity="0.55" filter="url(#shadowIndigoOnCyan)"/>
      </g>
    </g>
  </g>

  <!-- 5. Indigo Top Patch (Over Cyan at Top Crossing) -->
  <g clip-path="url(#indigoTopPatchClip)">
    <g transform="translate(309, 256) rotate(45)">
      <use href="#ringMaster" fill="url(#indigoGrad)"/>
    </g>
  </g>

  </g>

  <!-- Text & Positioning centered -->
  <g text-anchor="middle">
    <text x="600" y="410" font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', sans-serif" font-size="76" font-weight="800" letter-spacing="-1" fill="url(#socialTitle)">Partners</text>
    <text x="600" y="455" font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#38bdf8">AI AGENT EXECUTION GATEWAY</text>
    <text x="600" y="505" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Provider-Agnostic Sandbox Control Plane &amp; MicroVM Isolation for Autonomous Systems</text>

    <!-- Badges Row -->
    <g transform="translate(360, 545)">
      <rect x="0" y="0" width="215" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="4.5" fill="#38bdf8"/>
      <text x="120" y="23.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7dd3fc">PROVIDER-AGNOSTIC</text>

      <g transform="translate(235, 0)">
        <rect x="0" y="0" width="245" height="36" rx="18" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.2"/>
        <circle cx="20" cy="18" r="4.5" fill="#818cf8"/>
        <text x="135" y="23.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#a5b4fc">MULTI-RUNTIME MICROVM</text>
      </g>
    </g>
  </g>
</svg>